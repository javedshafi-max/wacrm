name: wacrm cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
      BASE_URL: https://crm.amaronbatterystore.com
    steps:
      - name: Sweep stale flow runs
        run: |
          echo "secret length: ${#CRON_SECRET}"
          code=$(curl -sS -o /tmp/flows.out -w "%{http_code}" -H "x-cron-secret: $CRON_SECRET" "$BASE_URL/api/flows/cron")
          echo "HTTP $code"
          cat /tmp/flows.out; echo
          test "$code" = "200"

      - name: Run due automations
        run: |
          code=$(curl -sS -o /tmp/auto.out -w "%{http_code}" -H "x-cron-secret: $CRON_SECRET" "$BASE_URL/api/automations/cron")
          echo "HTTP $code"
          cat /tmp/auto.out; echo
          test "$code" = "200"
